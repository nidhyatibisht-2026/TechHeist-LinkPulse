# One command runs everything:  docker compose up --build
# Then seed demo data:          docker compose exec api python -m scripts.seed --reset
# App: http://localhost:5173    API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: linkpulse
      POSTGRES_DB: linkpulse
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpulse"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://linkpulse:linkpulse@db:5432/linkpulse
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://linkpulse:linkpulse@db:5432/linkpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
